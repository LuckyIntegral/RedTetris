packages:
  - 'client'
  - 'server'

# Refuse to resolve package versions published less than 7 days ago (minutes);
# malicious releases are usually caught and pulled within that window
minimumReleaseAge: 10080
# Exact versions allowed before the 7 days are up: the only fixes for GHSA-g3hv-75wg-m249
# (minimatch) and GHSA-3g3m-2fjr-6pw4 (glob), plus their new dependencies. Remove once older than 7 days.
minimumReleaseAgeExclude:
  - minimatch@11.0.3
  - glob@14.0.3
  - path-scurry@3.0.0
  - '@isaacs/nonrecursive-glob-match@1.0.3'

# Security patches for vulnerable transitive dependencies (see `pnpm audit`).
# Each override stays inside the major version its dependents already request.
overrides:
  '@humanfs/node@~0.16': ~0.16.8
  compression@^1: ^1.8.2
  engine.io@^6: ^6.6.11
  flatted@^3: ^3.4.4
  js-yaml@^3: ^3.15.2
  lodash@^4: ^4.18.1
  morgan@^1: ^1.12.1
  nanoid@^3: ^3.3.20
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.7
  postcss@^8: ^8.5.31
  proxy-addr@^2: ^2.0.8
  rollup@^4: ^4.65.0
  socket.io-parser@^4: ^4.2.7
  source-map-js@^1: ^1.2.2
  undici@^7: ^7.30.1
  valibot@^1: ^1.5.0
  ws@^8: ^8.22.0
  # Cross-major: no fix exists before minimatch 11 / glob 14. Every dependent only uses the
  # unchanged public API (minimatch(), Minimatch#match, glob(), globSync(), glob.sync, hasMagic).
  minimatch@^10: ^11.0.3
  glob@^11: ^14.0.3
  glob@^13: ^14.0.3
